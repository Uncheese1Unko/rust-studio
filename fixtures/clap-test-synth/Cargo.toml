[package]
name = "clap-test-synth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "テスト用 CLAP シンセフィクスチャ（Issue #72）。製品コードではなく、プラグイン連携のパイプライン検証専用。"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = "0.2"
clack-common = "0.2"
clack-extensions = { version = "0.2", features = ["state", "clack-plugin"] }
